<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RHoo! &middot; Sistema de Recursos Humanos</title>
<meta name="theme-color" content="#0D1321">
<link rel="icon" href="img/favicon.ico">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* ═══════════════════════════════════════════════════════════
   RHoo! · Sistema de diseño
   Turquesa #2EC4B6 accion · Coral #F4795B atencion
   Neutros tintados al azul institucional: un gris puro junto a
   una marca de color se ve sucio.
   ═══════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#2EC4B6; --brand-h:#26A69A; --brand-p:#1E8A80;
  --brand-s:#E6F7F5; --brand-b:#A8E4DE;
  --acento:#F4795B; --acento-s:#FEEDE8;
  --tinta:#0D1321; --tinta-2:#1A2234; --tinta-3:#243049;
  --fondo:#F7FAFA; --panel:#FFF; --linea:#E4EAEA; --linea-s:#F0F4F4;
  --txt:#0D1321; --txt-2:#4A5568; --txt-3:#8494A7;
  --ok:#14A085; --alerta:#D97706; --error:#DC2626;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px;
  --s-sm:0 1px 2px rgba(13,19,33,.05);
  --s-md:0 4px 16px rgba(13,19,33,.06);
  --s-lg:0 12px 40px rgba(13,19,33,.12);
  --ease:cubic-bezier(0.16,1,0.3,1);
  --nav-w:248px;
}
html,body{height:100%}
body{
  font-family:'Nunito',system-ui,-apple-system,sans-serif;
  background:var(--fondo); color:var(--txt);
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums}

/* ── LOGIN ────────────────────────────────────────────────── */
/* Oscuro completo: es la unica pantalla donde la marca manda,
   segun el manual. El interior de la app va claro porque RH pasa
   horas leyendo tablas. */
#login{
  position:fixed; inset:0; z-index:300;
  background:var(--tinta);
  display:flex; align-items:center; justify-content:center;
  padding:24px;
}
#login::before{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(ellipse 55% 45% at 12% 0%, rgba(46,196,182,.10), transparent 55%),
    radial-gradient(ellipse 45% 55% at 88% 100%, rgba(244,121,91,.07), transparent 55%);
}
.lg-card{position:relative; width:100%; max-width:392px; animation:sube .5s var(--ease) both}
@keyframes sube{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.lg-marca{text-align:center; margin-bottom:32px}
.lg-marca img{height:64px; width:auto; margin:0 auto 4px; display:block}
.lg-marca p{font-size:.72rem; color:rgba(255,255,255,.42); letter-spacing:.14em; text-transform:uppercase}
.lg-panel{
  background:var(--tinta-2); border:1px solid rgba(255,255,255,.07);
  border-radius:var(--r-xl); padding:30px 26px;
}
.lg-panel h1{font-size:1.18rem; font-weight:800; color:#fff; margin-bottom:3px}
.lg-panel > p{font-size:.83rem; color:rgba(255,255,255,.45); margin-bottom:24px}
.campo{margin-bottom:15px}
.campo label{
  display:block; font-size:.68rem; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:rgba(255,255,255,.5); margin-bottom:6px;
}
/* display:block y no flex. En Prisma el ojo de la contrasena se
   salia de la caja porque el wrapper era flex y el input tenia
   width:100%: eran hermanos y el input empujaba al boton. */
.campo-pass{position:relative; display:block}
.campo input{
  width:100%; background:var(--tinta-3); color:#fff;
  border:1.5px solid rgba(255,255,255,.10); border-radius:var(--r-md);
  padding:12px 14px; font-size:.92rem; font-family:inherit;
  transition:border-color .18s, background-color .18s;
}
.campo-pass input{padding-right:46px}
.campo input:focus{outline:none; border-color:var(--brand); background:#2A3752}
.campo input::placeholder{color:rgba(255,255,255,.26)}
.ojo{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  width:34px; height:34px; display:flex; align-items:center; justify-content:center;
  background:none; border:none; cursor:pointer; border-radius:8px;
  color:rgba(255,255,255,.38); font-size:.86rem; transition:color .18s;
}
.ojo:hover{color:var(--brand)}
.btn-lg{
  width:100%; margin-top:8px; background:var(--brand); color:#062A26;
  font-family:inherit; font-size:.94rem; font-weight:800;
  border:none; border-radius:var(--r-md); padding:13px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:9px;
  transition:background-color .18s, transform .12s;
}
.btn-lg:hover{background:#3AD4C6}
.btn-lg:active{transform:scale(.99)}
.btn-lg:disabled{opacity:.45; cursor:not-allowed; transform:none}
.lg-err{
  display:none; align-items:flex-start; gap:8px;
  background:rgba(220,38,38,.12); border:1px solid rgba(220,38,38,.30);
  border-radius:var(--r-sm); padding:10px 12px; margin-bottom:16px;
  font-size:.81rem; color:#FCA5A5; line-height:1.45;
}
.lg-err.on{display:flex}
.lg-pie{margin-top:20px; text-align:center; font-size:.72rem; color:rgba(255,255,255,.28)}

/* ── APP ──────────────────────────────────────────────────── */
#app{display:none; min-height:100%}
#app.on{display:block}

#nav{
  position:fixed; inset:0 auto 0 0; width:var(--nav-w); z-index:100;
  background:var(--tinta); display:flex; flex-direction:column;
  transition:transform .3s var(--ease);
}
#nav::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse 70% 30% at 0% 0%, rgba(46,196,182,.07), transparent 60%);
}
.nav-top{
  position:relative; z-index:1; padding:20px 18px 16px;
  display:flex; align-items:center; gap:10px;
}
.nav-top img{height:34px; width:auto}
.nav-scroll{position:relative; z-index:1; flex:1; overflow-y:auto; padding:4px 10px 16px}
.nav-grupo{margin-bottom:18px}
.nav-grupo > h3{
  font-size:.62rem; font-weight:800; letter-spacing:.13em; text-transform:uppercase;
  color:rgba(255,255,255,.28); padding:0 8px; margin-bottom:6px;
}
.nav-btn{
  width:100%; display:flex; align-items:center; gap:11px;
  padding:9px 10px; margin-bottom:1px;
  background:none; border:none; cursor:pointer;
  font-family:inherit; font-size:.86rem; font-weight:600;
  color:rgba(255,255,255,.62); border-radius:var(--r-sm);
  text-align:left; transition:background-color .15s, color .15s;
}
.nav-btn i{width:17px; font-size:.86rem; text-align:center; flex-shrink:0}
.nav-btn:hover{background:rgba(255,255,255,.05); color:#fff}
/* Activo: fondo turquesa translucido, sin franja lateral */
.nav-btn.on{background:rgba(46,196,182,.15); color:var(--brand)}
.nav-pie{
  position:relative; z-index:1; padding:12px;
  border-top:1px solid rgba(255,255,255,.07);
}
.nav-user{display:flex; align-items:center; gap:10px; padding:6px 4px}
.avatar{
  width:34px; height:34px; border-radius:50%; flex-shrink:0;
  background:var(--brand); color:#062A26;
  display:flex; align-items:center; justify-content:center;
  font-size:.78rem; font-weight:800;
}
.nav-user div{min-width:0; flex:1}
.nav-user b{display:block; font-size:.81rem; color:#fff; font-weight:700;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.nav-user span{display:block; font-size:.68rem; color:rgba(255,255,255,.40);
  text-transform:capitalize}
.btn-salir{
  width:100%; margin-top:6px; padding:8px;
  background:none; border:1px solid rgba(255,255,255,.10); border-radius:var(--r-sm);
  color:rgba(255,255,255,.55); font-family:inherit; font-size:.78rem; font-weight:600;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px;
  transition:border-color .18s, color .18s;
}
.btn-salir:hover{border-color:rgba(220,38,38,.4); color:#FCA5A5}

#velo{
  display:none; position:fixed; inset:0; z-index:90;
  background:rgba(13,19,33,.5); backdrop-filter:blur(2px);
}
#velo.on{display:block}

#lienzo{margin-left:var(--nav-w); min-height:100vh; display:flex; flex-direction:column}
#barra{
  position:sticky; top:0; z-index:50;
  background:rgba(255,255,255,.88); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--linea);
  padding:0 22px; height:60px; display:flex; align-items:center; gap:14px;
}
#hamb{display:none; background:none; border:none; cursor:pointer;
  color:var(--txt-2); font-size:1.05rem; padding:6px}
#barra h2{flex:1; font-size:1.02rem; font-weight:800}
.barra-tenant{
  font-size:.72rem; font-weight:700; color:var(--txt-3);
  padding:5px 11px; background:var(--linea-s); border-radius:99px;
}
main{flex:1; padding:24px 22px 60px}

/* Estado vacío: honesto sobre lo que falta, en lugar de una
   pantalla en blanco que parece un error. */
.vacio{
  max-width:440px; margin:64px auto; text-align:center;
  background:var(--panel); border:1px solid var(--linea);
  border-radius:var(--r-xl); padding:44px 30px; box-shadow:var(--s-sm);
}
.vacio i{font-size:2rem; color:var(--brand-b); margin-bottom:14px; display:block}
.vacio h3{font-size:1.02rem; font-weight:800; margin-bottom:7px}
.vacio p{font-size:.86rem; color:var(--txt-2); line-height:1.6}
.vacio code{
  font-size:.78rem; background:var(--brand-s); color:var(--brand-p);
  padding:2px 6px; border-radius:5px;
}

#carga{
  position:fixed; inset:0; z-index:400; background:var(--tinta);
  display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:16px;
}
#carga.off{display:none}
#carga img{height:52px; animation:pulso 1.6s ease-in-out infinite}
@keyframes pulso{0%,100%{opacity:.5}50%{opacity:1}}
#carga p{font-size:.8rem; color:rgba(255,255,255,.4)}

@media(max-width:900px){
  #nav{transform:translateX(-100%); box-shadow:var(--s-lg)}
  #nav.on{transform:none}
  #lienzo{margin-left:0}
  #hamb{display:block}
  main{padding:18px 14px 48px}
  #barra{padding:0 14px}
  .barra-tenant{display:none}
}
/* ── Configuración ── */
.cfg-wrap{max-width:760px}
.cfg-sec{
  background:var(--panel); border:1px solid var(--linea);
  border-radius:var(--r-lg); padding:0 22px; margin-bottom:16px;
}
.cfg-head{padding:20px 0 4px}
.cfg-head h3{font-size:.95rem; font-weight:800}
.cfg-head p{font-size:.8rem; color:var(--txt-2); line-height:1.55; margin-top:5px}
/* Referencia legal: fondo tintado, sin franja lateral */
.cfg-ley{
  display:flex; gap:9px; align-items:flex-start;
  font-size:.78rem; color:var(--txt-2); line-height:1.55;
  background:var(--brand-s); border-radius:var(--r-sm);
  padding:10px 13px; margin:12px 0 4px;
}
.cfg-ley i{color:var(--brand-p); margin-top:2px; font-size:.75rem}
.cfg-fila{
  display:flex; align-items:flex-start; gap:24px;
  padding:17px 0; border-top:1px solid var(--linea-s);
}
.cfg-fila:first-of-type{border-top:none}
.cfg-fila.off{opacity:.4; pointer-events:none}
.cfg-txt{flex:1; min-width:0}
.cfg-txt label{display:block; font-size:.87rem; font-weight:700; line-height:1.4}
.cfg-txt p{font-size:.76rem; color:var(--txt-3); line-height:1.5; margin-top:4px}
.cfg-ctrl{flex-shrink:0; padding-top:2px}

.cfg-num{display:flex; align-items:center; gap:7px}
.cfg-num input{
  width:78px; text-align:right; font-variant-numeric:tabular-nums;
  font-family:inherit; font-size:.88rem; font-weight:700;
  border:1.5px solid var(--linea); border-radius:var(--r-sm);
  padding:7px 9px; background:var(--panel); color:var(--txt);
}
.cfg-num input:focus{outline:none; border-color:var(--brand)}
.cfg-num span{font-size:.75rem; color:var(--txt-3)}

/* Interruptor. El estado se lee por posición y color a la vez:
   solo por color, quien no distingue verde de gris no lo sabe. */
.sw{
  width:44px; height:25px; border-radius:99px; border:none; cursor:pointer;
  background:#CBD5D5; position:relative; transition:background-color .2s;
}
.sw.on{background:var(--brand)}
.sw span{
  position:absolute; top:3px; left:3px; width:19px; height:19px;
  border-radius:50%; background:#fff; box-shadow:var(--s-sm);
  transition:transform .2s var(--ease);
}
.sw.on span{transform:translateX(19px)}

.cfg-ops{display:flex; flex-direction:column; gap:6px; min-width:270px}
.cfg-op{
  display:flex; align-items:flex-start; gap:9px; cursor:pointer;
  border:1.5px solid var(--linea); border-radius:var(--r-sm);
  padding:9px 12px; font-size:.81rem; color:var(--txt-2);
  transition:border-color .16s, background-color .16s;
}
.cfg-op:hover{border-color:var(--brand-b)}
.cfg-op.on{border-color:var(--brand); background:var(--brand-s); color:var(--brand-p); font-weight:700}
.cfg-op input{margin-top:2px; accent-color:var(--brand)}

.cfg-barra{
  position:fixed; bottom:20px; left:calc(var(--nav-w) + 22px); right:22px;
  max-width:760px;
  background:var(--tinta); color:#fff; border-radius:var(--r-md);
  padding:12px 16px; display:flex; align-items:center; justify-content:space-between;
  gap:16px; box-shadow:var(--s-lg);
  transform:translateY(140%); transition:transform .3s var(--ease);
}
.cfg-barra.on{transform:none}
.cfg-barra span{font-size:.8rem; color:rgba(255,255,255,.65)}
.cfg-barra > div{display:flex; gap:9px}
.btn-pri, .btn-sec{
  font-family:inherit; font-size:.82rem; font-weight:700;
  border-radius:var(--r-sm); padding:9px 15px; cursor:pointer; border:none;
}
.btn-pri{background:var(--brand); color:#062A26}
.btn-pri:hover{background:#3AD4C6}
.btn-pri:disabled{opacity:.5; cursor:not-allowed}
.btn-sec{background:rgba(255,255,255,.10); color:rgba(255,255,255,.8)}
.btn-sec:hover{background:rgba(255,255,255,.18)}
.cargando{font-size:.85rem; color:var(--txt-3); padding:40px 0; text-align:center}

/* Avisos */
#toasts{position:fixed; bottom:22px; right:22px; z-index:200;
  display:flex; flex-direction:column; gap:9px}
.toast{
  display:flex; align-items:flex-start; gap:10px; max-width:340px;
  background:var(--panel); border:1px solid var(--linea);
  border-radius:var(--r-md); padding:13px 15px; box-shadow:var(--s-lg);
  font-size:.82rem; line-height:1.5;
  animation:entra .3s var(--ease) both;
}
@keyframes entra{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.toast i{margin-top:2px; flex-shrink:0}
.toast.ok i{color:var(--ok)}
.toast.error i{color:var(--error)}

@media(max-width:900px){
  .cfg-fila{flex-direction:column; gap:11px}
  .cfg-ctrl{width:100%}
  .cfg-ops{min-width:0}
  .cfg-barra{left:14px; right:14px; bottom:14px}
} 
/* ── Asistencia ── */
.ck-card{
  background:var(--panel); border:1px solid var(--linea);
  border-radius:var(--r-xl); padding:24px; max-width:440px; margin-bottom:24px;
  box-shadow:var(--s-md);
}
.ck-card.ck-off{
  display:flex; gap:12px; align-items:flex-start;
  background:var(--linea-s); border-style:dashed; box-shadow:none;
}
.ck-card.ck-off i{color:var(--txt-3); margin-top:3px}
.ck-card.ck-off p{font-size:.85rem; color:var(--txt-2); line-height:1.55}
.ck-top{display:flex; justify-content:space-between; align-items:flex-start; gap:16px}
.ck-hora{font-size:2.6rem; font-weight:900; line-height:1; font-variant-numeric:tabular-nums}
.ck-fecha{font-size:.8rem; color:var(--txt-3); margin-top:3px; text-transform:capitalize}
.ck-turno{
  font-size:.72rem; color:var(--txt-3); text-align:right; line-height:1.5;
  background:var(--brand-s); padding:7px 11px; border-radius:var(--r-sm);
}
.ck-turno b{color:var(--brand-p); font-variant-numeric:tabular-nums}
.ck-turno.ck-descanso{background:var(--linea-s)}
.ck-geo{
  display:flex; align-items:center; gap:7px; margin-top:14px;
  font-size:.78rem; color:var(--txt-2);
  background:var(--linea-s); padding:8px 12px; border-radius:var(--r-sm);
}
.ck-geo.ok{background:var(--brand-s); color:var(--brand-p); font-weight:600}
.ck-geo.err{background:#FEF2F2; color:#B91C1C}
.ck-btn{
  width:100%; margin-top:16px; padding:16px;
  background:var(--brand); color:#062A26; border:none; border-radius:var(--r-md);
  font-family:inherit; font-size:1rem; font-weight:800; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:10px;
  transition:background-color .18s, transform .12s;
}
.ck-btn:hover{background:#3AD4C6}
.ck-btn:active{transform:scale(.99)}
.ck-btn:disabled{opacity:.45; cursor:not-allowed; transform:none}
.ck-lista{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.ck-lista span{
  font-size:.76rem; color:var(--txt-2); background:var(--linea-s);
  padding:6px 11px; border-radius:99px; font-variant-numeric:tabular-nums;
}
.ck-lista b{color:var(--txt-3); font-weight:700; margin-right:6px}
.ck-nada{font-size:.79rem; color:var(--txt-3); margin-top:14px; text-align:center}
.ck-retardo{
  font-size:.78rem; color:#B45309; background:#FEF3E2;
  padding:8px 12px; border-radius:var(--r-sm); margin-top:12px;
}

.asis-barra{
  display:flex; align-items:center; justify-content:space-between;
  gap:14px; margin-bottom:18px; flex-wrap:wrap;
}
.asis-tabs{display:flex; gap:6px}
.asis-tab{
  padding:8px 15px; border-radius:99px; border:none; cursor:pointer;
  font-family:inherit; font-size:.83rem; font-weight:700;
  background:var(--linea-s); color:var(--txt-2); transition:all .16s;
}
.asis-tab:hover{background:var(--linea)}
.asis-tab.on{background:var(--brand); color:#062A26}
#asis-fecha{
  font-family:inherit; font-size:.83rem; padding:8px 12px;
  border:1.5px solid var(--linea); border-radius:var(--r-sm); color:var(--txt);
}
#asis-fecha:focus{outline:none; border-color:var(--brand)}

.tb-resumen{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px}
.tb-kpi{
  background:var(--panel); border:1px solid var(--linea);
  border-radius:var(--r-md); padding:12px 18px; min-width:96px;
}
.tb-kpi b{display:block; font-size:1.6rem; font-weight:900;
  line-height:1; font-variant-numeric:tabular-nums}
.tb-kpi span{font-size:.72rem; color:var(--txt-3); font-weight:600}

.tb-tabla{
  background:var(--panel); border:1px solid var(--linea);
  border-radius:var(--r-lg); overflow:hidden;
}
.tb-tabla table{width:100%; border-collapse:collapse}
.tb-tabla th{
  text-align:left; font-size:.68rem; font-weight:800; letter-spacing:.07em;
  text-transform:uppercase; color:var(--txt-3);
  padding:12px 16px; border-bottom:1px solid var(--linea); white-space:nowrap;
}
.tb-tabla td{
  padding:12px 16px; font-size:.84rem; border-bottom:1px solid var(--linea-s);
  vertical-align:middle;
}
.tb-tabla tr:last-child td{border-bottom:none}
.tb-tabla tbody tr:hover{background:#F4FAFA}
.tb-tabla td.num{font-variant-numeric:tabular-nums}
.tb-sub{display:block; font-size:.72rem; color:var(--txt-3); margin-top:2px}
.tb-tarde{font-size:.7rem; color:#B45309; font-weight:700; margin-left:5px}
.tb-badge{
  display:inline-block; font-size:.72rem; font-weight:700;
  padding:4px 10px; border-radius:99px; white-space:nowrap;
}

.aviso{
  display:flex; gap:9px; align-items:flex-start;
  font-size:.79rem; color:var(--txt-2); line-height:1.55;
  background:var(--brand-s); border-radius:var(--r-sm);
  padding:11px 14px; margin-bottom:16px;
}
.aviso i{color:var(--brand-p); margin-top:2px; flex-shrink:0}

.ub-grid{display:grid; grid-template-columns:340px 1fr; gap:20px; align-items:start}
.ub-h{
  font-size:.7rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase;
  color:var(--txt-3); margin-bottom:9px;
  display:flex; align-items:center; justify-content:space-between;
}
.ub-add{
  background:none; border:none; cursor:pointer; font-family:inherit;
  font-size:.72rem; font-weight:700; color:var(--brand-p);
  display:flex; align-items:center; gap:5px; text-transform:none; letter-spacing:0;
}
.ub-item{
  width:100%; text-align:left; cursor:pointer; margin-bottom:6px;
  background:var(--panel); border:1.5px solid var(--linea);
  border-radius:var(--r-md); padding:11px 14px;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  font-family:inherit; transition:border-color .16s;
}
.ub-item:hover{border-color:var(--brand)}
.ub-item.sin{border-style:dashed}
.ub-item b{display:block; font-size:.85rem; color:var(--txt)}
.ub-item span{font-size:.72rem; color:var(--txt-3); text-transform:capitalize}
.ub-coord{
  font-size:.7rem !important; color:var(--txt-3); text-align:right;
  font-variant-numeric:tabular-nums; flex-shrink:0; text-transform:none !important;
}
.ub-nada{font-size:.78rem; color:var(--txt-3); line-height:1.55; padding:4px 2px}
#mapa{
  height:420px; border-radius:var(--r-lg); border:1px solid var(--linea);
  z-index:1;
}
.ub-tip{font-size:.74rem; color:var(--txt-3); margin-top:8px; text-align:center}
.ub-editor{
  background:var(--panel); border:1px solid var(--linea);
  border-radius:var(--r-md); padding:16px; margin-top:12px;
}
.ub-editor p b{font-size:.88rem}
.ub-editor label{
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; font-size:.82rem; font-weight:700; margin:12px 0;
}
.ub-nota{font-size:.74rem; color:var(--txt-3); line-height:1.5; margin-bottom:12px}

.dv-top{display:flex; gap:16px; align-items:flex-start; margin-bottom:18px}
.dv-top .aviso{flex:1}
.dv-lista{display:flex; flex-direction:column; gap:8px}
.dv-item{
  display:flex; align-items:center; gap:14px;
  background:var(--panel); border:1px solid var(--linea);
  border-radius:var(--r-md); padding:14px 16px;
}
.dv-ico{
  width:38px; height:38px; border-radius:var(--r-sm); flex-shrink:0;
  background:var(--brand-s); color:var(--brand-p);
  display:flex; align-items:center; justify-content:center;
}
.dv-ico.off{background:var(--linea-s); color:var(--txt-3)}
.dv-info{flex:1; min-width:0}
.dv-info b{display:block; font-size:.87rem}
.dv-info span{font-size:.73rem; color:var(--txt-3)}
.dv-est{
  font-size:.73rem; font-weight:700; color:var(--ok);
  background:#E3F5F0; padding:5px 11px; border-radius:99px; flex-shrink:0;
}
.dv-est.frio{color:var(--error); background:#FEF2F2}

@media(max-width:900px){
  .ub-grid{grid-template-columns:1fr}
  #mapa{height:320px}
  .dv-top{flex-direction:column}
  /* La tabla se vuelve tarjetas: una tabla de 6 columnas en un
     celular obliga a desplazarse a los lados para leer un renglon. */
  .tb-tabla thead{display:none}
  .tb-tabla tr{display:block; padding:12px 14px; border-bottom:1px solid var(--linea-s)}
  .tb-tabla td{
    display:flex; justify-content:space-between; gap:14px;
    padding:4px 0; border:none; font-size:.82rem;
  }
  .tb-tabla td::before{
    content:attr(data-l); font-size:.7rem; font-weight:700;
    color:var(--txt-3); text-transform:uppercase; letter-spacing:.05em;
  }
  .tb-tabla td:first-child{
    flex-direction:column; align-items:flex-start; gap:0; margin-bottom:6px;
  }
  .tb-tabla td:first-child::before{display:none}
}  
/* ── Modal ── */
.md-fondo{
  position:fixed; inset:0; z-index:250;
  background:rgba(13,19,33,.55); backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center; padding:20px;
  opacity:0; transition:opacity .2s;
}
.md-fondo.on{opacity:1}
.md-caja{
  background:var(--panel); border-radius:var(--r-xl);
  width:100%; max-width:620px; max-height:88vh;
  display:flex; flex-direction:column; box-shadow:var(--s-lg);
  transform:translateY(16px) scale(.98); transition:transform .22s var(--ease);
}
.md-fondo.on .md-caja{transform:none}
.md-top{
  display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
  padding:22px 24px 16px; border-bottom:1px solid var(--linea-s);
}
.md-top h3{font-size:1.05rem; font-weight:800}
.md-top p{font-size:.82rem; color:var(--txt-2); line-height:1.5; margin-top:4px}
.md-x{
  background:none; border:none; cursor:pointer; color:var(--txt-3);
  font-size:1rem; padding:4px 8px; border-radius:var(--r-sm);
  flex-shrink:0; transition:color .16s, background-color .16s;
}
.md-x:hover{color:var(--txt); background:var(--linea-s)}
.md-cuerpo{overflow-y:auto; padding:20px 24px}
.md-campos{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.md-campo{display:flex; flex-direction:column; gap:5px}
.md-campo.full{grid-column:1 / -1}
.md-campo > span{font-size:.78rem; font-weight:700; color:var(--txt-2)}
.md-campo > span b{color:var(--acento)}
.md-campo input, .md-campo select, .md-campo textarea{
  font-family:inherit; font-size:.87rem; color:var(--txt);
  border:1.5px solid var(--linea); border-radius:var(--r-sm);
  padding:9px 11px; background:var(--panel); width:100%;
  transition:border-color .16s;
}
.md-campo input:focus, .md-campo select:focus, .md-campo textarea:focus{
  outline:none; border-color:var(--brand);
}
.md-campo input:invalid:not(:placeholder-shown){border-color:var(--error)}
.md-campo textarea{resize:vertical; min-height:64px}
.md-campo em{font-size:.72rem; color:var(--txt-3); font-style:normal; line-height:1.45}
.md-pie{
  display:flex; justify-content:flex-end; gap:9px;
  padding:16px 24px; border-top:1px solid var(--linea-s);
}
.btn-sec-claro{
  font-family:inherit; font-size:.83rem; font-weight:700;
  padding:9px 16px; border-radius:var(--r-sm); cursor:pointer;
  background:var(--linea-s); color:var(--txt-2); border:none;
}
.btn-sec-claro:hover{background:var(--linea)}
.btn-peligro{
  font-family:inherit; font-size:.83rem; font-weight:700;
  padding:9px 16px; border-radius:var(--r-sm); cursor:pointer;
  background:var(--error); color:#fff; border:none;
}
.btn-peligro:hover{background:#B91C1C}

/* ── Panel lateral ── */
.pn-fondo{
  position:fixed; inset:0; z-index:240;
  background:rgba(13,19,33,.45); backdrop-filter:blur(2px);
  opacity:0; transition:opacity .22s;
}
.pn-fondo.on{opacity:1}
.pn-caja{
  position:absolute; top:0; right:0; bottom:0; width:min(520px, 100%);
  background:var(--fondo); display:flex; flex-direction:column;
  box-shadow:var(--s-lg);
  transform:translateX(100%); transition:transform .28s var(--ease);
}
.pn-fondo.on .pn-caja{transform:none}
.pn-top{
  display:flex; align-items:flex-start; justify-content:space-between; gap:14px;
  padding:20px 22px 16px; background:var(--panel);
  border-bottom:1px solid var(--linea);
}
.pn-top h3{font-size:1.05rem; font-weight:800; line-height:1.3}
.pn-top p{font-size:.8rem; color:var(--txt-3); margin-top:3px}
.pn-cuerpo{flex:1; overflow-y:auto; padding:18px 22px 30px}
.pn-pie{
  display:flex; gap:9px; padding:14px 22px;
  background:var(--panel); border-top:1px solid var(--linea);
}
.pn-pie button{flex:1}

.ex-sec{margin-bottom:22px}
.ex-sec h4{
  font-size:.68rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase;
  color:var(--txt-3); margin-bottom:10px;
}
.ex-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:1px;
  background:var(--linea-s); border-radius:var(--r-md); overflow:hidden;
}
.ex-dato{background:var(--panel); padding:10px 13px}
.ex-dato span{display:block; font-size:.7rem; color:var(--txt-3); font-weight:600}
.ex-dato b{font-size:.85rem; font-weight:700; word-break:break-word}
.ex-vac{
  display:flex; gap:16px; align-items:center; margin-top:12px;
  background:var(--brand-s); border-radius:var(--r-md); padding:14px 16px;
}
.ex-vac > div{text-align:center; flex-shrink:0}
.ex-vac b{display:block; font-size:1.9rem; font-weight:900; color:var(--brand-p);
  line-height:1; font-variant-numeric:tabular-nums}
.ex-vac span{font-size:.68rem; color:var(--txt-2); font-weight:600}
.ex-vac p{font-size:.78rem; color:var(--txt-2); line-height:1.55}
.ex-vac p b{display:inline; font-size:.78rem; color:var(--brand-p)}
.ex-jorn{display:flex; flex-direction:column; gap:1px;
  background:var(--linea-s); border-radius:var(--r-md); overflow:hidden}
.ex-j{
  display:flex; align-items:center; gap:12px;
  background:var(--panel); padding:9px 13px; font-size:.8rem;
}
.ex-jf{font-weight:700; min-width:56px}
.ex-jh{margin-left:auto; color:var(--txt-3); font-size:.76rem}

/* ── Empleados ── */
.emp-barra{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap}
.emp-busca{position:relative; flex:1; min-width:220px}
.emp-busca i{
  position:absolute; left:13px; top:50%; transform:translateY(-50%);
  color:var(--txt-3); font-size:.82rem; pointer-events:none;
}
.emp-busca input{
  width:100%; font-family:inherit; font-size:.87rem;
  border:1.5px solid var(--linea); border-radius:var(--r-sm);
  padding:9px 12px 9px 36px; background:var(--panel); color:var(--txt);
}
.emp-busca input:focus{outline:none; border-color:var(--brand)}
.emp-sel{
  font-family:inherit; font-size:.85rem; padding:9px 12px;
  border:1.5px solid var(--linea); border-radius:var(--r-sm);
  background:var(--panel); color:var(--txt); cursor:pointer;
}
.emp-sel:focus{outline:none; border-color:var(--brand)}
.emp-fila{cursor:pointer}
.emp-ver{width:34px; text-align:center; color:var(--linea)}
.emp-fila:hover .emp-ver{color:var(--brand)}
.emp-pag{
  display:flex; align-items:center; justify-content:space-between;
  gap:14px; margin-top:16px;
}
.emp-pag button{
  font-family:inherit; font-size:.82rem; font-weight:700; cursor:pointer;
  background:var(--panel); border:1.5px solid var(--linea);
  border-radius:var(--r-sm); padding:8px 14px; color:var(--txt-2);
}
.emp-pag button:hover:not(:disabled){border-color:var(--brand); color:var(--brand-p)}
.emp-pag button:disabled{opacity:.4; cursor:not-allowed}
.emp-pag span{font-size:.78rem; color:var(--txt-3); font-variant-numeric:tabular-nums}
.emp-cuenta{font-size:.78rem; color:var(--txt-3); margin-top:14px; text-align:center}

@media(max-width:640px){
  .md-campos{grid-template-columns:1fr}
  .md-campo.mitad{grid-column:1 / -1}
  .ex-grid{grid-template-columns:1fr}
  .md-caja{max-height:94vh}
  .ex-vac{flex-direction:column; text-align:center}
}
/* ── Turnos ── */
.tu-head{display:flex; gap:14px; align-items:flex-start; margin-bottom:14px}
.tu-lista{display:flex; flex-direction:column; gap:8px}
.tu-item{
  display:flex; align-items:center; gap:14px; cursor:pointer;
  background:var(--panel); border:1px solid var(--linea);
  border-radius:var(--r-md); padding:13px 16px;
  transition:border-color .16s;
}
.tu-item:hover{border-color:var(--brand)}
.tu-item.off{opacity:.5}
.tu-color{
  width:44px; height:36px; border-radius:var(--r-sm); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:.72rem; font-weight:800; letter-spacing:.04em;
}
.tu-info{flex:1; min-width:0}
.tu-info b{display:block; font-size:.88rem}
.tu-info span{font-size:.75rem; color:var(--txt-3)}
.tu-meta{text-align:right; flex-shrink:0}
.tu-meta span{display:block; font-size:.7rem; color:var(--txt-3)}
.tu-meta b{font-size:1.1rem; font-weight:800; font-variant-numeric:tabular-nums}
.tu-meta em{display:block; font-size:.66rem; color:var(--txt-3); font-style:normal}
.tu-ciclo{display:flex; gap:3px; flex-shrink:0}

.cal-d, .cal-t{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:26px; height:26px; border-radius:6px;
  font-size:.68rem; font-weight:800;
}
.cal-t{background:var(--brand-s); color:var(--brand-p)}
.cal-d{background:var(--linea-s); color:var(--txt-3)}

.cal-nav{display:flex; align-items:center; gap:10px; margin-bottom:14px}
.cal-nav button{
  background:var(--panel); border:1.5px solid var(--linea); cursor:pointer;
  border-radius:var(--r-sm); padding:7px 12px; color:var(--txt-2);
  font-family:inherit; font-size:.8rem;
}
.cal-nav button:hover{border-color:var(--brand); color:var(--brand-p)}
.cal-nav span{font-size:.86rem; font-weight:700; flex:1; text-align:center}
.cal-hoy{font-weight:700}

.cal-scroll{overflow-x:auto; background:var(--panel);
  border:1px solid var(--linea); border-radius:var(--r-lg)}
table.cal{border-collapse:collapse; width:100%}
table.cal th{
  padding:9px 4px; text-align:center; font-size:.68rem;
  border-bottom:1px solid var(--linea); color:var(--txt-3);
}
table.cal th span{display:block; font-size:.6rem; font-weight:700;
  text-transform:uppercase}
table.cal th b{font-size:.82rem; color:var(--txt-2)}
table.cal th.cal-finde{background:var(--linea-s)}
table.cal th.cal-hoy-col{background:var(--brand-s)}
table.cal th.cal-hoy-col b{color:var(--brand-p)}
.cal-nom{
  text-align:left !important; padding:8px 12px !important;
  position:sticky; left:0; background:var(--panel); z-index:1;
  border-right:1px solid var(--linea); min-width:170px;
  font-size:.8rem; font-weight:700;
}
.cal-nom span{display:block; font-size:.68rem; color:var(--txt-3); font-weight:600}
td.cal-c{
  text-align:center; padding:4px 3px;
  border-bottom:1px solid var(--linea-s);
}
td.cal-c .cal-t{background:color-mix(in oklch, var(--c) 18%, white);
  color:color-mix(in oklch, var(--c) 75%, black)}
td.cal-fest{background:#FEF3E2}
.cal-leyenda{display:flex; flex-wrap:wrap; gap:12px; margin-top:12px}
.cal-leyenda span{display:inline-flex; align-items:center; gap:6px;
  font-size:.72rem; color:var(--txt-3)}
.cal-leyenda i{width:11px; height:11px; border-radius:3px; display:inline-block}
.cal-li-d{background:var(--linea)}
.cal-li-f{background:#FEF3E2; border:1px solid #F5C078}

.pat-campos{display:grid; gap:12px}
.pat-ciclo{display:flex; flex-wrap:wrap; gap:8px; align-items:flex-start}
.pat-slot{position:relative; display:flex; flex-direction:column; gap:3px}
.pat-n{font-size:.62rem; color:var(--txt-3); font-weight:700; text-align:center}
.pat-slot select{
  font-family:inherit; font-size:.78rem; padding:7px 8px;
  border:1.5px solid var(--linea); border-radius:var(--r-sm);
  background:var(--panel); min-width:88px;
}
.pat-slot select:focus{outline:none; border-color:var(--brand)}
.pat-x{
  position:absolute; top:14px; right:-5px; width:17px; height:17px;
  border-radius:50%; border:none; cursor:pointer;
  background:var(--error); color:#fff; font-size:.55rem;
  display:flex; align-items:center; justify-content:center;
}
.pat-add{
  margin-top:16px; width:36px; height:34px; cursor:pointer;
  background:var(--brand-s); color:var(--brand-p);
  border:1.5px dashed var(--brand-b); border-radius:var(--r-sm);
}
.pat-aviso{
  display:flex; gap:9px; align-items:flex-start; margin-top:14px;
  font-size:.78rem; color:#92400E; line-height:1.55;
  background:#FEF3E2; border-radius:var(--r-sm); padding:11px 13px;
}
.pat-aviso i{margin-top:2px; flex-shrink:0}
.pat-vista{margin-top:20px}
.pat-prev{display:flex; flex-wrap:wrap; gap:3px}

@media(max-width:640px){
  .tu-head{flex-direction:column}
  .cal-nom{min-width:130px; font-size:.75rem}
}
/* ── Documentos ── */
.doc-faltan{
  background:#FEF3E2; border-radius:var(--r-md); padding:13px 15px; margin-bottom:14px;
}
.doc-faltan p{display:flex; align-items:center; gap:8px; font-size:.82rem;
  color:#92400E; margin-bottom:9px}
.doc-faltan > div{display:flex; flex-wrap:wrap; gap:6px}
.doc-faltan button{
  font-family:inherit; font-size:.74rem; font-weight:700; cursor:pointer;
  background:#fff; border:1px solid #F5C078; color:#92400E;
  border-radius:99px; padding:5px 11px;
}
.doc-faltan button:hover{background:#FDF5E6}
.doc-ok{
  display:flex; align-items:center; gap:8px; font-size:.82rem;
  color:var(--ok); background:#E3F5F0; border-radius:var(--r-md);
  padding:12px 15px; margin-bottom:14px;
}
.doc-add{width:100%; justify-content:center; display:flex;
  align-items:center; gap:8px; padding:11px}
.doc-lista{display:flex; flex-direction:column; gap:7px; margin-top:14px}
.doc-item{
  display:flex; align-items:center; gap:12px;
  background:var(--panel); border:1px solid var(--linea);
  border-radius:var(--r-md); padding:11px 13px;
}
.doc-item.venc{background:#FEF2F2; border-color:#FECACA}
.doc-ico{font-size:1.15rem; color:var(--txt-3); flex-shrink:0; width:20px;
  text-align:center}
.doc-info{flex:1; min-width:0}
.doc-info b{display:block; font-size:.84rem}
.doc-info span{display:block; font-size:.72rem; color:var(--txt-3);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.doc-info em{display:block; font-size:.7rem; color:var(--txt-3); font-style:normal}
.doc-info em.venc{color:var(--error); font-weight:700}
.doc-info em.pv{color:#B45309; font-weight:700}
.doc-acc{display:flex; gap:4px; flex-shrink:0}
.doc-acc button{
  background:none; border:none; cursor:pointer; color:var(--txt-3);
  padding:7px 8px; border-radius:var(--r-sm); font-size:.82rem;
}
.doc-acc button:hover{background:var(--linea-s); color:var(--txt)}
.doc-ocr{
  display:flex; align-items:center; gap:5px;
  background:var(--brand-s) !important; color:var(--brand-p) !important;
  font-family:inherit; font-size:.72rem; font-weight:700;
  padding:6px 10px !important; white-space:nowrap;
}
.doc-est{color:var(--txt-3); font-size:.78rem; padding:0 8px}
/* ── PWA ── */
.pwa-instalar{
  width:100%; margin-bottom:8px; padding:9px;
  background:rgba(46,196,182,.14); border:1px solid rgba(46,196,182,.3);
  border-radius:var(--r-sm); cursor:pointer;
  color:var(--brand); font-family:inherit; font-size:.78rem; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:7px;
  transition:background-color .18s;
}
.pwa-instalar:hover{background:rgba(46,196,182,.22)}
.pwa-barra{
  position:fixed; bottom:16px; left:50%; z-index:280;
  transform:translate(-50%, 140%);
  display:flex; align-items:center; gap:16px;
  background:var(--tinta); color:#fff;
  border-radius:var(--r-md); padding:12px 16px;
  box-shadow:var(--s-lg); max-width:calc(100vw - 28px);
  transition:transform .3s var(--ease);
}
.pwa-barra.on{transform:translate(-50%, 0)}
.pwa-barra span{display:flex; align-items:center; gap:9px;
  font-size:.83rem; font-weight:600; white-space:nowrap}
.pwa-barra span i{color:var(--brand)}
.pwa-barra > div{display:flex; gap:7px; flex-shrink:0}
.pwa-ok, .pwa-x{
  font-family:inherit; font-size:.79rem; font-weight:700; cursor:pointer;
  border:none; border-radius:var(--r-sm); padding:7px 13px;
}
.pwa-ok{background:var(--brand); color:#062A26}
.pwa-x{background:rgba(255,255,255,.12); color:rgba(255,255,255,.75)}
@media(max-width:520px){
  .pwa-barra{flex-direction:column; align-items:stretch; gap:10px;
    left:14px; right:14px; transform:translateY(140%); max-width:none}
  .pwa-barra.on{transform:none}
  .pwa-barra > div{justify-content:flex-end}
}
/* ── Incidencias ── */
.inc-lista{display:flex; flex-direction:column; gap:10px}
.inc-item{
  background:var(--panel); border:1px solid var(--linea);
  border-radius:var(--r-md); padding:15px 17px;
}
.inc-top{display:flex; align-items:flex-start; justify-content:space-between;
  gap:12px; margin-bottom:9px}
.inc-tit b{display:block; font-size:.9rem; font-weight:800}
.inc-tit span{font-size:.78rem; color:var(--txt-2); font-weight:600}
.inc-fechas{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  font-size:.82rem; color:var(--txt-2);
}
.inc-fechas i{color:var(--txt-3); font-size:.75rem}
.inc-fechas b{font-variant-numeric:tabular-nums; color:var(--txt)}
.inc-fechas em{font-size:.72rem; color:var(--brand-p); font-style:normal;
  background:var(--brand-s); padding:2px 8px; border-radius:99px}
.inc-com{
  font-size:.79rem; color:var(--txt-2); line-height:1.5; margin-top:9px;
  background:var(--linea-s); border-radius:var(--r-sm); padding:9px 11px;
}
.inc-firmas{display:flex; flex-direction:column; gap:4px; margin-top:10px}
.inc-firmas span{
  display:flex; align-items:flex-start; gap:7px;
  font-size:.75rem; color:var(--txt-2); line-height:1.45;
}
.inc-firmas span i{margin-top:3px; font-size:.68rem}
.inc-firmas span.si i{color:var(--ok)}
.inc-firmas span.no i{color:var(--error)}
.inc-espera{
  font-size:.76rem; color:#B45309; margin-top:9px;
  background:#FEF3E2; border-radius:var(--r-sm); padding:8px 11px;
}
.inc-acc{display:flex; gap:7px; margin-top:12px; flex-wrap:wrap}
.inc-acc button{flex:1; min-width:110px}

/* ── Vacaciones ── */
.vac-top{
  display:flex; gap:20px; align-items:stretch; margin-bottom:16px; flex-wrap:wrap;
}
.vac-saldo{
  background:var(--brand); border-radius:var(--r-lg);
  padding:22px 30px; text-align:center; color:#062A26; flex-shrink:0;
}
.vac-saldo b{display:block; font-size:3rem; font-weight:900; line-height:1;
  font-variant-numeric:tabular-nums}
.vac-saldo span{font-size:.76rem; font-weight:700; opacity:.75}
.vac-datos{
  flex:1; min-width:250px; background:var(--panel);
  border:1px solid var(--linea); border-radius:var(--r-lg);
  padding:8px 18px; display:flex; flex-direction:column; justify-content:center;
}
.vac-datos p{
  display:flex; justify-content:space-between; gap:16px;
  padding:7px 0; font-size:.82rem; border-bottom:1px solid var(--linea-s);
}
.vac-datos p:last-child{border-bottom:none}
.vac-datos span{color:var(--txt-2)}
.vac-datos b{font-weight:800; font-variant-numeric:tabular-nums}
.vac-ley{
  display:flex; gap:9px; align-items:flex-start;
  font-size:.78rem; color:var(--txt-2); line-height:1.55;
  background:var(--brand-s); border-radius:var(--r-sm);
  padding:11px 14px; margin-bottom:16px;
}
.vac-ley i{color:var(--brand-p); margin-top:2px; flex-shrink:0}
.vac-mov{display:flex; flex-direction:column; gap:1px;
  background:var(--linea-s); border-radius:var(--r-md); overflow:hidden}
.vac-m{
  display:flex; align-items:center; gap:14px;
  background:var(--panel); padding:11px 14px; font-size:.82rem;
}
.vac-md{color:var(--txt-3); font-size:.75rem; min-width:62px; flex-shrink:0}
.vac-mt{flex:1; min-width:0}
.vac-mt em{display:block; font-size:.72rem; color:var(--txt-3); font-style:normal}
.vac-mn{font-weight:800; font-variant-numeric:tabular-nums; flex-shrink:0}
.vac-mn.mas{color:var(--ok)}
.vac-mn.menos{color:var(--error)}

@media(max-width:640px){
  .vac-saldo{width:100%}
  .inc-acc button{min-width:0}
}
.ex-link{
  display:block; margin-top:7px; background:none; border:none; padding:0;
  cursor:pointer; font-family:inherit; font-size:.76rem; font-weight:700;
  color:var(--brand-p); text-decoration:underline;
}
/* ── Organigrama ── */
.org-arbol{
  background:var(--panel); border:1px solid var(--linea);
  border-radius:var(--r-lg); padding:6px 0; overflow:hidden;
}
.org-fila{
  display:flex; align-items:center; gap:9px;
  padding:8px 16px 8px calc(16px + var(--n) * 26px);
  border-bottom:1px solid var(--linea-s);
  position:relative;
}
.org-fila:last-child{border-bottom:none}
.org-fila:hover{background:#F4FAFA}
/* Guía de nivel: una línea sutil, no un árbol de conectores.
   Los conectores en un árbol plegable se rompen visualmente en
   cuanto se colapsa una rama. */
.org-fila::before{
  content:''; position:absolute; left:calc(11px + var(--n) * 26px);
  top:0; bottom:0; width:1px; background:var(--linea);
  display:var(--linea-nivel, block);
}
.org-fila[style*="--n:0"]::before{display:none}
.org-toggle{
  width:22px; height:22px; flex-shrink:0; cursor:pointer;
  background:var(--linea-s); border:none; border-radius:5px;
  color:var(--txt-2); font-size:.62rem; z-index:1;
}
.org-toggle:hover{background:var(--brand-s); color:var(--brand-p)}
.org-hoja{width:22px; flex-shrink:0}
.org-info{flex:1; min-width:0; cursor:pointer}
.org-info b{display:block; font-size:.85rem}
.org-info span{font-size:.73rem; color:var(--txt-3)}
.org-eq{
  font-size:.7rem; font-weight:800; color:var(--brand-p);
  background:var(--brand-s); border-radius:99px; padding:3px 9px;
  flex-shrink:0; font-variant-numeric:tabular-nums;
}
.org-mover{
  background:none; border:none; cursor:pointer; color:var(--linea);
  padding:6px 7px; border-radius:var(--r-sm); font-size:.75rem; flex-shrink:0;
}
.org-fila:hover .org-mover{color:var(--txt-3)}
.org-mover:hover{background:var(--linea-s); color:var(--brand-p) !important}

.org-solos{
  margin-top:18px; background:#FEF3E2; border-radius:var(--r-lg); padding:16px 18px;
}
.org-solos h4{
  display:flex; align-items:center; gap:8px;
  font-size:.82rem; font-weight:800; color:#92400E; margin-bottom:6px;
}
.org-solos p{font-size:.77rem; color:#92400E; line-height:1.5; margin-bottom:11px}
.org-chips{display:flex; flex-wrap:wrap; gap:7px}
.org-chips button{
  display:flex; align-items:center; gap:7px; cursor:pointer;
  font-family:inherit; font-size:.76rem; font-weight:600;
  background:#fff; border:1px solid #F5C078; color:#92400E;
  border-radius:99px; padding:6px 12px;
}
.org-chips button:hover{background:#FDF5E6}
.org-chips button i{font-size:.62rem; opacity:.6}

.eq-lista{display:flex; flex-direction:column; gap:8px}
.eq-item{
  display:flex; align-items:center; gap:13px; cursor:pointer;
  background:var(--panel); border:1px solid var(--linea);
  border-radius:var(--r-md); padding:12px 15px;
  transition:border-color .16s;
}
.eq-item:hover{border-color:var(--brand)}
.eq-info{flex:1; min-width:0}
.eq-info b{display:block; font-size:.87rem}
.eq-info span{font-size:.73rem; color:var(--txt-3)}
.eq-meta{display:flex; align-items:center; gap:9px; flex-wrap:wrap;
  justify-content:flex-end}
.eq-vac{font-size:.74rem; color:var(--txt-2); font-variant-numeric:tabular-nums}
.eq-pend{
  font-size:.72rem; font-weight:700; color:#B45309;
  background:#FEF3E2; border-radius:99px; padding:3px 9px;
}

@media(max-width:640px){
  .org-fila{padding-left:calc(10px + var(--n) * 18px)}
  .org-fila::before{left:calc(6px + var(--n) * 18px)}
  .eq-item{flex-wrap:wrap}
  .eq-meta{width:100%; justify-content:flex-start}
}
/* ── Cumplimiento / NOM-035 ── */
.cu-head{display:flex; align-items:flex-start; justify-content:space-between;
  gap:16px; margin-bottom:16px; flex-wrap:wrap}
.cu-head h3{font-size:1rem; font-weight:800}
.cu-head p{font-size:.8rem; color:var(--txt-3); margin-top:3px; max-width:520px;
  line-height:1.5}
.cu-h{font-size:.7rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase;
  color:var(--txt-3); margin:22px 0 7px}
.cu-nota{font-size:.76rem; color:var(--txt-3); line-height:1.55; margin-bottom:10px}
.cu-volver{
  background:none; border:none; cursor:pointer; padding:0 0 12px;
  font-family:inherit; font-size:.8rem; font-weight:700; color:var(--txt-3);
  display:flex; align-items:center; gap:6px;
}
.cu-volver:hover{color:var(--brand-p)}

.cu-vig{background:#FEF3E2; border-radius:var(--r-md); padding:14px 16px; margin-bottom:16px}
.cu-vig h4{display:flex; align-items:center; gap:8px; font-size:.82rem;
  font-weight:800; color:#92400E; margin-bottom:8px}
.cu-vig-f{display:flex; justify-content:space-between; gap:14px; padding:4px 0;
  font-size:.82rem}
.cu-vig-f b{font-weight:700}
.cu-vig-f span{font-weight:700; font-size:.78rem}

.cu-camps{display:flex; flex-direction:column; gap:10px}
.cu-camp{
  background:var(--panel); border:1px solid var(--linea); border-radius:var(--r-md);
  padding:15px 17px; cursor:pointer; transition:border-color .16s;
}
.cu-camp:hover{border-color:var(--brand)}
.cu-camp-t{display:flex; align-items:flex-start; justify-content:space-between;
  gap:12px; margin-bottom:11px}
.cu-camp-t b{display:block; font-size:.9rem; font-weight:800}
.cu-camp-t span{font-size:.75rem; color:var(--txt-3)}
.cu-est{font-size:.7rem; font-weight:800; padding:4px 10px; border-radius:99px;
  text-transform:capitalize; flex-shrink:0}
.cu-abierta{background:var(--brand-s); color:var(--brand-p)}
.cu-cerrada{background:var(--linea-s); color:var(--txt-3)}
.cu-borrador{background:#FEF3E2; color:#92400E}
.cu-camp-p{display:flex; align-items:center; gap:12px}
.cu-prog{flex:1; height:7px; background:var(--linea-s); border-radius:99px; overflow:hidden}
.cu-prog div{height:100%; background:var(--brand); border-radius:99px;
  transition:width .4s var(--ease)}
.cu-prog.gr{height:10px; margin-bottom:6px}
.cu-camp-p .num{font-size:.78rem; color:var(--txt-3); flex-shrink:0}
.cu-camp-m{font-size:.73rem; color:#B45309; margin-top:8px}
.cu-camp-m.ok{color:var(--ok)}

.cu-kpis{display:flex; gap:11px; margin-bottom:14px; flex-wrap:wrap}
.cu-kpi{flex:1; min-width:110px; background:var(--panel); border:1px solid var(--linea);
  border-radius:var(--r-md); padding:14px 16px}
.cu-kpi b{display:block; font-size:1.7rem; font-weight:900; line-height:1}
.cu-kpi span{font-size:.72rem; color:var(--txt-3); font-weight:600}
.cu-kpi.ok b{color:var(--ok)}

.cu-pend{display:flex; flex-direction:column; gap:5px}
.cu-pend-f{display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:var(--panel); border:1px solid var(--linea); border-radius:10px;
  padding:9px 13px}
.cu-pend-f b{display:block; font-size:.83rem}
.cu-pend-f span{font-size:.72rem; color:var(--txt-3)}
.cu-pend-f button{background:var(--brand-s); border:none; cursor:pointer;
  color:var(--brand-p); padding:7px 11px; border-radius:8px; font-size:.8rem}
.cu-pend-f button:hover{background:var(--brand-b)}
.cu-hechos{display:flex; flex-wrap:wrap; gap:6px}
.cu-hechos span{font-size:.75rem; color:var(--txt-2); background:var(--linea-s);
  padding:5px 11px; border-radius:99px}

/* Dashboard */
.da-top{display:flex; gap:12px; margin-bottom:14px; flex-wrap:wrap}
.da-nivel, .da-riesgo{
  flex:1; min-width:230px; border-radius:var(--r-lg); padding:18px 20px;
  border:1.5px solid var(--linea); background:var(--panel);
}
.da-nivel span, .da-riesgo span{display:block; font-size:.73rem; font-weight:700;
  color:var(--txt-3); text-transform:uppercase; letter-spacing:.05em}
.da-nivel b, .da-riesgo b{display:block; font-size:2rem; font-weight:900;
  line-height:1.1; margin:5px 0 4px}
.da-nivel em, .da-riesgo em{font-size:.74rem; color:var(--txt-3); font-style:normal;
  line-height:1.45; display:block}

.da-card{background:var(--panel); border:1px solid var(--linea);
  border-radius:var(--r-lg); padding:20px 22px; margin-bottom:14px}
.da-card h4{font-size:.9rem; font-weight:800; margin-bottom:10px}

.nv-barra{display:flex; border-radius:99px; overflow:hidden; background:var(--linea-s)}
.nv-barra div{transition:width .4s var(--ease)}
.nv-leyenda{display:flex; flex-wrap:wrap; gap:10px 16px; margin-top:12px}
.nv-leyenda span{display:inline-flex; align-items:center; gap:6px; font-size:.73rem;
  color:var(--txt-3)}
.nv-leyenda i{width:10px; height:10px; border-radius:3px; display:inline-block}
.da-nums{display:flex; flex-wrap:wrap; gap:9px 18px; margin-top:13px}
.da-nums span{display:inline-flex; align-items:center; gap:7px; font-size:.79rem;
  color:var(--txt-2)}
.da-nums i{width:10px; height:10px; border-radius:3px; display:inline-block}
.da-nums b{font-weight:800}

.da-doms{display:flex; flex-direction:column; gap:12px}
.da-dom-t{display:flex; justify-content:space-between; align-items:baseline;
  gap:12px; margin-bottom:5px}
.da-dom-t span{font-size:.81rem; font-weight:600; color:var(--txt-2); line-height:1.35}
.da-dom-t b{font-size:.79rem; font-weight:800; flex-shrink:0}
/* La línea del umbral: un porcentaje sin su referencia obliga a
   recordar el criterio de memoria. */
.da-dom-b{position:relative}
.da-umbral{position:absolute; top:-3px; bottom:-3px; width:2px;
  background:rgba(13,19,33,.55); pointer-events:none}

.da-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px}
.da-chip{padding:6px 13px; border-radius:99px; border:none; cursor:pointer;
  font-family:inherit; font-size:.78rem; font-weight:700;
  background:var(--linea-s); color:var(--txt-2)}
.da-chip:hover{background:var(--linea)}
.da-chip.on{background:var(--brand); color:#062A26}

.da-perf{display:flex; flex-direction:column; gap:11px}
.da-perf-t{display:flex; justify-content:space-between; align-items:baseline;
  gap:12px; margin-bottom:4px}
.da-perf-t span{font-size:.82rem; font-weight:600; color:var(--txt-2)}
.da-perf-t b{font-size:.82rem; font-weight:800}
.da-perf-b{height:9px; background:var(--linea-s); border-radius:99px; overflow:hidden}
.da-perf-b div{height:100%; border-radius:99px; transition:width .4s var(--ease)}
.da-perf-n{display:block; font-size:.71rem; color:var(--txt-3); margin-top:3px}

.da-g1{display:flex; gap:22px}
.da-g1 div b{display:block; font-size:1.6rem; font-weight:900; line-height:1}
.da-g1 div span{font-size:.73rem; color:var(--txt-3); font-weight:600}

/* Informe */
.inf h2{font-size:1.1rem; font-weight:900; margin-bottom:3px}
.inf-sub{font-size:.78rem; color:var(--txt-3); margin-bottom:18px; line-height:1.5}
.inf h3{font-size:.85rem; font-weight:800; margin:20px 0 7px;
  padding-bottom:4px; border-bottom:1px solid var(--linea)}
.inf h4{font-size:.79rem; font-weight:800; margin:14px 0 6px; color:var(--txt-2)}
.inf p{font-size:.82rem; line-height:1.6; margin-bottom:9px; color:var(--txt-2)}
.inf-t{width:100%; border-collapse:collapse; margin-bottom:10px; font-size:.78rem}
.inf-t td, .inf-t th{border:1px solid var(--linea); padding:6px 9px; text-align:left}
.inf-t th{background:var(--linea-s); font-weight:800}
.inf-t td:first-child{width:40%; color:var(--txt-3)}
.inf-blank{background:var(--linea-s)}
.inf-crit{font-size:.76rem !important; background:var(--linea-s);
  padding:9px 11px; border-radius:8px; color:var(--txt-3) !important}
.inf-pie{font-size:.7rem; color:var(--txt-3); text-align:right; margin-top:20px}

@media(max-width:640px){
  .da-top{flex-direction:column}
  .cu-kpis{gap:8px}
  .cu-kpi{min-width:0}
  .da-g1{gap:16px}
}
/* ── Programa de intervención ── */
.pr-grupo{margin-bottom:20px}
.pr-grupo h4{font-size:.82rem; font-weight:800; margin-bottom:9px;
  padding-bottom:5px; border-bottom:1px solid var(--linea)}
.pr-acc{
  background:var(--panel); border:1px solid var(--linea); border-radius:var(--r-md);
  padding:13px 15px; margin-bottom:7px; cursor:pointer;
  transition:border-color .16s;
}
.pr-acc:hover{border-color:var(--brand)}
.pr-acc.venc{background:#FEF7F7}
.pr-acc-t{display:flex; align-items:center; justify-content:space-between;
  gap:10px; margin-bottom:7px}
.pr-niv{font-size:.68rem; font-weight:800; letter-spacing:.06em;
  text-transform:uppercase}
.pr-acc p{font-size:.85rem; line-height:1.5; color:var(--txt); margin-bottom:9px}
.pr-acc-m{display:flex; flex-wrap:wrap; gap:6px 14px}
.pr-acc-m span{display:inline-flex; align-items:center; gap:5px;
  font-size:.73rem; color:var(--txt-3)}
.pr-acc-m span i{font-size:.68rem}
.pr-acc-m span.venc{color:#B91C1C; font-weight:700}
.pr-acc-m span.falta{color:#B45309}
.pr-acc-m span.ok{color:var(--ok)}

.dif-url{display:flex; align-items:center; gap:8px;
  background:var(--linea-s); border-radius:var(--r-sm); padding:11px 13px}
.dif-url code{flex:1; font-size:.79rem; color:var(--txt-2); word-break:break-all}
.dif-url button{background:var(--brand-s); border:none; cursor:pointer;
  color:var(--brand-p); padding:7px 11px; border-radius:8px; flex-shrink:0}
/* ── Proveedor ── */
.pv-lista{display:flex; flex-direction:column; gap:9px}
.pv-cli{
  background:var(--panel); border:1px solid var(--linea); border-radius:var(--r-md);
  padding:14px 16px; cursor:pointer; transition:border-color .16s;
}
.pv-cli:hover{border-color:var(--brand)}
.pv-cli.susp{background:#FEF7F7; border-color:#FECACA}
.pv-cli-t{display:flex; align-items:flex-start; justify-content:space-between;
  gap:12px; margin-bottom:10px}
.pv-cli-t b{display:block; font-size:.92rem; font-weight:800}
.pv-cli-t span{font-size:.74rem; color:var(--txt-3)}
.pv-cli-m{display:flex; flex-wrap:wrap; gap:7px 16px}
.pv-cli-m span{font-size:.75rem; color:var(--txt-3)}
.pv-cli-m b{color:var(--txt); font-weight:800}
.pv-cli-m span.lleno b{color:#B91C1C}
.pv-cli-m span.frio{color:#B45309}
.pv-feat{background:var(--brand-s); color:var(--brand-p) !important;
  padding:2px 9px; border-radius:99px; font-size:.7rem !important; font-weight:700}
.pv-lleno{font-size:.74rem; color:#B91C1C; margin-top:8px}
.cu-kpi.alerta b{color:#B45309}
/* ── Usuarios ── */
.us-lista{display:flex; flex-direction:column; gap:8px}
.us-item{
  display:flex; align-items:center; gap:13px;
  background:var(--panel); border:1px solid var(--linea);
  border-radius:var(--r-md); padding:12px 15px;
}
.us-item.off{opacity:.55; background:var(--linea-s)}
.us-info{flex:1; min-width:0}
.us-info b{display:block; font-size:.88rem}
.us-info b em{font-style:normal; color:var(--txt-3); font-weight:600; font-size:.78rem}
.us-info span{display:block; font-size:.74rem; color:var(--txt-3)}
.us-emp{color:var(--brand-p) !important}
.us-meta{display:flex; flex-direction:column; align-items:flex-end; gap:3px;
  flex-shrink:0}
.us-rol{font-size:.72rem; font-weight:800; color:var(--brand-p);
  background:var(--brand-s); padding:3px 10px; border-radius:99px}
.us-est{font-size:.7rem; font-weight:700; color:var(--error)}
.us-nunca{font-size:.7rem; color:#B45309; font-weight:600}
.us-acc{font-size:.7rem; color:var(--txt-3)}
.us-temp{font-size:.7rem; color:#B45309}
.us-acc-btn{display:flex; gap:3px; flex-shrink:0}
.us-acc-btn button{
  background:none; border:none; cursor:pointer; color:var(--txt-3);
  padding:7px 8px; border-radius:var(--r-sm); font-size:.8rem;
}
.us-acc-btn button:hover{background:var(--linea-s); color:var(--brand-p)}

.cred{display:flex; flex-direction:column; gap:1px;
  background:var(--linea-s); border-radius:var(--r-md); overflow:hidden}
.cred-f{background:var(--panel); padding:11px 14px}
.cred-f span{display:block; font-size:.7rem; color:var(--txt-3); font-weight:700;
  text-transform:uppercase; letter-spacing:.05em}
.cred-f b{font-size:.88rem; word-break:break-all}
.cred-pass b{
  font-family:ui-monospace, monospace; font-size:1.1rem;
  color:var(--brand-p); letter-spacing:.06em;
}
/* ── Notificaciones ── */
.campana{
  position:relative; background:none; border:none; cursor:pointer;
  color:var(--txt-2); font-size:1rem; padding:8px 10px;
  border-radius:var(--r-sm); transition:background-color .16s, color .16s;
}
.campana:hover{background:var(--linea-s); color:var(--brand-p)}
#notif-badge{
  display:none; position:absolute; top:3px; right:4px;
  min-width:17px; height:17px; padding:0 4px;
  background:var(--acento); color:#fff;
  border-radius:99px; font-size:.62rem; font-weight:800;
  line-height:17px; text-align:center;
  border:2px solid var(--panel);
}
#notif-badge.on{display:block}

.nt-lista{display:flex; flex-direction:column; gap:6px}
.nt{
  display:flex; align-items:flex-start; gap:12px;
  background:var(--panel); border:1px solid var(--linea);
  border-radius:var(--r-md); padding:13px 15px; cursor:pointer;
  position:relative; transition:border-color .16s;
}
.nt:hover{border-color:var(--brand)}
/* Lo leido se atenua pero no desaparece: buscar algo que ya se
   leyo es un caso real. */
.nt.leida{opacity:.6; background:var(--linea-s)}
.nt-i{
  width:34px; height:34px; border-radius:9px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:.9rem;
}
.nt-txt{flex:1; min-width:0}
.nt-txt b{display:block; font-size:.86rem; line-height:1.35; margin-bottom:3px}
.nt-txt p{font-size:.78rem; color:var(--txt-2); line-height:1.5; margin-bottom:5px}
.nt-txt span{font-size:.71rem; color:var(--txt-3)}
.nt-txt em{font-style:normal; font-weight:700}
.nt-punto{
  position:absolute; top:14px; right:14px;
  width:8px; height:8px; border-radius:50%; background:var(--acento);
}

@media(max-width:900px){ .campana{padding:8px} }
/* ── Calendario ── */
.cal-nav{display:flex; align-items:center; gap:10px; margin-bottom:14px}
.cal-nav button{
  background:var(--panel); border:1.5px solid var(--linea); cursor:pointer;
  border-radius:var(--r-sm); padding:7px 12px; color:var(--txt-2);
  font-family:inherit; font-size:.8rem;
}
.cal-nav button:hover{border-color:var(--brand); color:var(--brand-p)}
.cal-nav span{font-size:.95rem; font-weight:800; flex:1; text-align:center;
  text-transform:capitalize}

.cal-filtros{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px}
.cal-chip{
  display:inline-flex; align-items:center; gap:6px;
  padding:5px 12px; border-radius:99px; border:1.5px solid var(--linea);
  background:var(--panel); cursor:pointer;
  font-family:inherit; font-size:.75rem; font-weight:600; color:var(--txt-3);
}
.cal-chip i{font-size:.68rem}
.cal-chip.on{background:var(--brand-s); border-color:var(--brand-b);
  color:var(--brand-p); font-weight:700}

.cal-rejilla{
  display:grid; grid-template-columns:repeat(7, 1fr); gap:1px;
  background:var(--linea); border:1px solid var(--linea);
  border-radius:var(--r-lg); overflow:hidden;
}
.cal-dow{
  background:var(--linea-s); padding:8px 6px; text-align:center;
  font-size:.68rem; font-weight:800; color:var(--txt-3);
  text-transform:uppercase; letter-spacing:.06em;
}
.cal-celda{
  background:var(--panel); min-height:88px; padding:5px 6px;
  display:flex; flex-direction:column; gap:3px; cursor:default;
}
.cal-celda[onclick]{cursor:pointer}
.cal-celda[onclick]:hover{background:#F4FAFA}
.cal-celda.fuera{background:var(--linea-s); opacity:.55}
.cal-celda.finde{background:#FBFDFD}
.cal-celda.hoy{box-shadow:inset 0 0 0 2px var(--brand)}
.cal-num{font-size:.76rem; font-weight:700; color:var(--txt-2)}
.cal-celda.hoy .cal-num{color:var(--brand-p)}
.cal-evs{display:flex; flex-direction:column; gap:2px; overflow:hidden}
/* Barra de color a la izquierda del texto, no una franja
   decorativa: identifica el tipo sin robar espacio. */
.cal-ev{
  font-size:.66rem; line-height:1.3; padding:2px 5px;
  border-radius:4px; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis;
  background:color-mix(in oklch, var(--c) 14%, white);
  color:color-mix(in oklch, var(--c) 78%, black);
  font-weight:600;
}
.cal-ev.propio{box-shadow:inset 2px 0 0 var(--c)}
.cal-mas{font-size:.63rem; color:var(--txt-3); padding-left:5px}

.dia-lista{display:flex; flex-direction:column; gap:8px}
.dia-ev{
  display:flex; align-items:flex-start; gap:12px;
  background:var(--panel); border:1px solid var(--linea);
  border-radius:var(--r-md); padding:12px 14px;
}
.dia-ev i{margin-top:2px; font-size:.95rem; flex-shrink:0}
.dia-ev b{display:block; font-size:.86rem; line-height:1.35}
.dia-ev span{display:block; font-size:.75rem; color:var(--txt-3); margin-top:2px}
.dia-dest{color:#0EA5E9 !important; font-weight:700}

/* Vista de equipo */
.eq-scroll{overflow-x:auto; background:var(--panel);
  border:1px solid var(--linea); border-radius:var(--r-lg)}
table.eq-cal{border-collapse:collapse; width:100%}
table.eq-cal th{
  padding:7px 2px; text-align:center; font-size:.66rem; font-weight:700;
  color:var(--txt-3); border-bottom:1px solid var(--linea); min-width:22px;
}
table.eq-cal th.eq-finde{background:var(--linea-s)}
table.eq-cal th.eq-hoy{background:var(--brand-s); color:var(--brand-p)}
table.eq-cal td{padding:3px 2px; text-align:center;
  border-bottom:1px solid var(--linea-s)}
table.eq-cal td.eq-finde{background:#FBFDFD}
.eq-nom{
  text-align:left !important; padding:6px 12px !important;
  position:sticky; left:0; background:var(--panel); z-index:1;
  border-right:1px solid var(--linea); min-width:170px;
  font-size:.78rem; font-weight:600;
}
.eq-b{display:block; height:16px; border-radius:3px}
.eq-alerta{
  margin-top:14px; background:#FEF3E2; border-radius:var(--r-md); padding:14px 16px;
}
.eq-alerta h4{display:flex; align-items:center; gap:8px; font-size:.82rem;
  font-weight:800; color:#92400E; margin-bottom:8px}
.eq-alerta span{display:inline-block; margin-right:16px; font-size:.79rem;
  color:#92400E}

/* Inicio */
.in-saludo{margin-bottom:18px}
.in-saludo h2{font-size:1.3rem; font-weight:900}
.in-saludo p{font-size:.84rem; color:var(--txt-3); margin-top:3px;
  text-transform:capitalize}
.in-accion{
  display:flex; align-items:center; gap:14px; cursor:pointer;
  background:var(--brand-s); border:1.5px solid var(--brand-b);
  border-radius:var(--r-lg); padding:16px 18px; margin-bottom:16px;
  transition:background-color .16s;
}
.in-accion:hover{background:#D5F2EF}
.in-accion > i:first-child{font-size:1.2rem; color:var(--brand-p)}
.in-accion div{flex:1}
.in-accion b{display:block; font-size:.92rem; color:var(--brand-p)}
.in-accion span{font-size:.78rem; color:var(--txt-2)}
.in-accion > i:last-child{color:var(--brand-p); font-size:.8rem}

.in-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr));
  gap:12px}
.in-card{
  background:var(--panel); border:1px solid var(--linea);
  border-radius:var(--r-lg); padding:18px 20px;
}
.in-card h4{display:flex; align-items:center; gap:9px;
  font-size:.85rem; font-weight:800; margin-bottom:11px}
.in-card h4 i{color:var(--txt-3); font-size:.85rem}
.in-celebra h4 i{color:#DB2777}
.in-link{cursor:pointer; transition:border-color .16s}
.in-link:hover{border-color:var(--brand)}
.in-lista{display:flex; flex-direction:column; gap:9px}
.in-lista > div b{display:block; font-size:.85rem}
.in-lista > div span{font-size:.74rem; color:var(--txt-3)}
.in-vacio{font-size:.8rem; color:var(--txt-3); line-height:1.5}

@media(max-width:640px){
  .cal-celda{min-height:66px; padding:4px}
  .cal-ev{font-size:.6rem}
  .cal-num{font-size:.7rem}
  .eq-nom{min-width:120px; font-size:.72rem}
}
</style>
</head>
<body>

<!-- Pantalla de arranque: evita el parpadeo de login mientras
     Supabase revisa si ya hay sesion guardada -->
<div id="carga">
  <img src="img/logo-isotipo.svg" alt="RHoo!">
  <p>Cargando...</p>
</div>

<!-- ── LOGIN ── -->
<div id="login" style="display:none">
  <div class="lg-card">
    <div class="lg-marca">
      <img src="img/logo-completo.svg" alt="RHoo! Sistema de Recursos Humanos">
    </div>
    <div class="lg-panel">
      <h1>Bienvenido</h1>
      <p>Ingresa con tu cuenta para continuar</p>

      <div class="lg-err" id="lg-err">
        <i class="fas fa-circle-exclamation" style="margin-top:2px"></i>
        <span id="lg-err-txt"></span>
      </div>

      <form id="lg-form" autocomplete="on">
        <div class="campo">
          <label for="lg-mail">Correo</label>
          <input type="email" id="lg-mail" placeholder="tu@empresa.com"
                 autocomplete="username" required>
        </div>
        <div class="campo">
          <label for="lg-pass">Contrase&ntilde;a</label>
          <span class="campo-pass">
            <input type="password" id="lg-pass" placeholder="Tu contrase&ntilde;a"
                   autocomplete="current-password" required>
            <button type="button" class="ojo" id="lg-ojo"
                    aria-label="Mostrar contrase&ntilde;a">
              <i class="fas fa-eye"></i>
            </button>
          </span>
        </div>
        <button type="submit" class="btn-lg" id="lg-btn">
          <i class="fas fa-arrow-right-to-bracket" style="font-size:.82rem"></i>
          Entrar
        </button>
      </form>
    </div>
    <p class="lg-pie">RHoo! <span id="lg-ver"></span></p>
  </div>
</div>

<!-- ── APP ── -->
<div id="app">
  <div id="velo" onclick="cerrarNav()"></div>

  <nav id="nav">
    <div class="nav-top">
      <img src="img/logo-completo.svg" alt="RHoo!">
    </div>
    <div class="nav-scroll" id="nav-items"></div>
    <div class="nav-pie">
      <div class="nav-user">
        <span class="avatar" id="u-ini">?</span>
        <div>
          <b id="u-nom">&mdash;</b>
          <span id="u-rol">&mdash;</span>
        </div>
      </div>
      <button class="btn-salir" onclick="salir()">
        <i class="fas fa-power-off" style="font-size:.72rem"></i> Cerrar sesi&oacute;n
      </button>
    </div>
  </nav>

  <div id="lienzo">
    <header id="barra">
      <button id="hamb" onclick="abrirNav()" aria-label="Men&uacute;">
        <i class="fas fa-bars"></i>
      </button>
      <h2 id="titulo">Inicio</h2>
      <button class="campana" onclick="abrirNotifs()" aria-label="Notificaciones">
        <i class="fas fa-bell"></i>
        <span id="notif-badge"></span>
      </button>
      <span class="barra-tenant" id="b-tenant"></span>
    </header>
    <main id="contenido"></main>
  </div>
  <div id="toasts"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/ui.js"></script>
<script src="js/modulos/config.js"></script>
<script src="js/modulos/empleados.js"></script>
<script src="js/modulos/turnos.js"></script>
<script src="js/modulos/documentos.js"></script>
<script src="js/modulos/incidencias.js"></script>
<script src="js/modulos/organigrama.js"></script>
<script src="js/modulos/cumplimiento.js"></script>
<script src="js/modulos/proveedor.js"></script>
<script src="js/modulos/usuarios.js"></script>
<script src="js/modulos/calendario.js"></script>
<script src="js/modulos/asistencia.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════
   RHoo! · Shell
   ═══════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);

/* Catálogo de módulos. `roles` es solo para pintar el menú: la
   seguridad de verdad está en RLS. Si alguien fabrica el botón a
   mano, la base no le devuelve nada ajeno. */
const MODULOS = [
  { grupo:'Operación', items:[
    { id:'inicio',     nombre:'Inicio',      icono:'fa-house',          roles:'*' },
    { id:'calendario', nombre:'Calendario',  icono:'fa-calendar-days',  roles:'*' },
    { id:'asistencia', nombre:'Asistencia',  icono:'fa-fingerprint',    roles:'*' },
    { id:'incidencias',nombre:'Incidencias', icono:'fa-calendar-check', roles:'*' },
    { id:'vacaciones', nombre:'Vacaciones',  icono:'fa-umbrella-beach', roles:'*' }
  ]},
  { grupo:'Personal', items:[
    { id:'empleados',  nombre:'Empleados',   icono:'fa-users',          roles:'jefe' },
    { id:'organigrama',nombre:'Mi equipo',   icono:'fa-sitemap',        roles:'jefe' },
    { id:'turnos',     nombre:'Turnos',      icono:'fa-clock-rotate-left', roles:'admin' },
    { id:'cumplimiento', nombre:'Cumplimiento', icono:'fa-shield-halved', roles:'admin' }
  ]},
  { grupo:'Proveedor', items:[
    { id:'proveedor', nombre:'Clientes', icono:'fa-building', roles:'proveedor' }
  ]},
  { grupo:'Administración', items:[
    { id:'config',     nombre:'Configuraci&oacute;n', icono:'fa-sliders', roles:'admin' },
    { id:'usuarios',   nombre:'Usuarios',    icono:'fa-user-gear',      roles:'admin' }
  ]}
];

let moduloActivo = 'inicio';

function puedeVer(roles){
  if(roles === '*')         return true;
  if(roles === 'jefe')      return Sesion.esJefe;
  if(roles === 'admin')     return Sesion.esAdmin;
  // Solo el proveedor. El menú es cosmético: lo que de verdad
  // protege es que las funciones validan app.es_proveedor().
  if(roles === 'proveedor') return Sesion.rol === 'superadmin';
  return false;
}

function pintarNav(){
  $('nav-items').innerHTML = MODULOS.map(g => {
    const vis = g.items.filter(m => puedeVer(m.roles));
    if(!vis.length) return '';       // grupo sin permisos: no se pinta el titulo
    return '<div class="nav-grupo"><h3>'+g.grupo+'</h3>'
      + vis.map(m =>
          '<button class="nav-btn'+(m.id===moduloActivo?' on':'')+'" '
          + 'data-mod="'+m.id+'" onclick="irA(\''+m.id+'\')">'
          + '<i class="fas '+m.icono+'"></i>'+m.nombre+'</button>'
        ).join('')
      + '</div>';
  }).join('');
}

function irA(id){
  moduloActivo = id;
  pintarNav();
  const m = MODULOS.flatMap(g=>g.items).find(x=>x.id===id);
  $('titulo').innerHTML = m ? m.nombre : id;
  if(window.innerWidth < 900) cerrarNav();
  pintarModulo(id);
}

/* Los módulos aún no existen. Se dice qué falta en lugar de
   dejar la pantalla en blanco, que se lee como un error. */
/* Avisos breves. Se van solos: un aviso de exito que exige un
   clic para cerrarse es una interrupcion, no una confirmacion. */
function toast(tipo, msg){
  const cont = $('toasts');
  if(!cont) return;
  const el = document.createElement('div');
  el.className = 'toast ' + tipo;
  el.innerHTML = '<i class="fas fa-'
    + (tipo === 'ok' ? 'circle-check' : 'circle-exclamation')
    + '"></i><span>' + msg + '</span>';
  cont.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s, transform .3s';
    el.style.opacity = '0';
    el.style.transform = 'translateX(24px)';
    setTimeout(() => el.remove(), 320);
  }, tipo === 'error' ? 6000 : 3000);
}

/* Registro de módulos. Cada uno expone una función que pinta en
   #contenido; los que aún no existen caen al estado vacío. */
const RUTAS = {
  config:     () => moduloConfig(),
  asistencia: () => moduloAsistencia(),
  empleados:  () => moduloEmpleados(),
  turnos:      () => moduloTurnos(),
  incidencias: () => moduloIncidencias(),
  vacaciones:   () => moduloVacaciones(),
  organigrama:   () => moduloOrganigrama(),
  cumplimiento:  () => moduloCumplimiento(),
  proveedor:     () => moduloProveedor(),
  usuarios:      () => moduloUsuarios(),
  calendario:    () => moduloCalendario(),
  inicio:        () => moduloInicio()
};

function pintarModulo(id){
  if(RUTAS[id]) { RUTAS[id](); return; }
  $('contenido').innerHTML =
    '<div class="vacio">'
    + '<i class="fas fa-drafting-compass"></i>'
    + '<h3>M&oacute;dulo en construcci&oacute;n</h3>'
    + '<p>Las tablas de <code>'+id+'</code> ya existen en la base '
    + 'con RLS activo. Falta la interfaz.</p></div>';
}

function abrirNav(){ $('nav').classList.add('on'); $('velo').classList.add('on') }
function cerrarNav(){ $('nav').classList.remove('on'); $('velo').classList.remove('on') }

function iniciales(nom){
  return (nom||'?').trim().split(/\s+/).slice(0,2)
         .map(p=>p[0]).join('').toUpperCase();
}

/* ── Autenticación ── */

function errLogin(msg){
  $('lg-err-txt').textContent = msg;
  $('lg-err').classList.add('on');
}

$('lg-ojo').addEventListener('click', () => {
  const i = $('lg-pass');
  const mostrar = i.type === 'password';
  i.type = mostrar ? 'text' : 'password';
  $('lg-ojo').innerHTML = '<i class="fas fa-eye'+(mostrar?'-slash':'')+'"></i>';
  i.focus();
});

$('lg-form').addEventListener('submit', async e => {
  e.preventDefault();
  $('lg-err').classList.remove('on');
  const btn = $('lg-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando...';

  const { error } = await sb.auth.signInWithPassword({
    email: $('lg-mail').value.trim(),
    password: $('lg-pass').value
  });

  if(error){
    // Mensaje propio: "Invalid login credentials" no le dice nada
    // a nadie, y traducirlo literal suena a máquina.
    errLogin(error.message.includes('Invalid')
      ? 'Correo o contrase\u00f1a incorrectos.'
      : 'No se pudo iniciar sesi\u00f3n. Revisa tu conexi\u00f3n.');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket" style="font-size:.82rem"></i> Entrar';
    return;
  }
  // El listener de onAuthStateChange se encarga del resto
});

async function salir(){
  await sb.auth.signOut();
  location.reload();
}

/* Carga perfil y tenant. Sin perfil no hay nada que mostrar:
   RLS bloquea todo porque app.mi_tenant() devuelve NULL. Es el
   comportamiento correcto, pero hay que explicarlo. */
async function cargarSesion(user){
  Sesion.user = user;

  const { data: perfil, error } = await sb
    .from('perfiles')
    .select('id, tenant_id, rol, nombre, email, empleado_id, debe_cambiar_password, activo')
    .eq('id', user.id)
    .single();

  if(error || !perfil){
    $('carga').classList.add('off');
    $('login').style.display = 'flex';
    errLogin('Tu cuenta no tiene un perfil asignado. Contacta al administrador.');
    await sb.auth.signOut();
    return;
  }
  // Un usuario desactivado no debe pasar del login. RLS ya le
  // bloquea los datos, pero sin esto entra a una app vacía y
  // parece que el sistema está roto en lugar de que su cuenta
  // fue dada de baja.
  if(perfil.activo === false){
    $('carga').classList.add('off');
    $('login').style.display = 'flex';
    errLogin('Tu cuenta está desactivada. Contacta a Recursos Humanos.');
    await sb.auth.signOut();
    return;
  }
  Sesion.perfil = perfil;

  const { data: tenant } = await sb
    .from('tenants')
    .select('id, slug, nombre, plan')
    .eq('id', perfil.tenant_id)
    .single();
  Sesion.tenant = tenant;

  $('u-ini').textContent  = iniciales(perfil.nombre);
  $('u-nom').textContent  = perfil.nombre;
  $('u-rol').textContent  = perfil.rol;
  // El proveedor no necesita ver su propio nombre: lo que le
  // sirve es saber en qué cliente está trabajando. Cuando
  // exista el selector de tenant, aquí va el cliente activo.
  $('b-tenant').textContent = Sesion.rol === 'superadmin'
    ? 'Proveedor'
    : (tenant?.nombre || '');

  $('login').style.display = 'none';
  $('app').classList.add('on');
  $('carga').classList.add('off');

  pintarNav();

  if(typeof arrancarNotifs === 'function') arrancarNotifs();

  // Contraseña temporal: se pide cambiarla ANTES de dejar usar la
  // app. Si solo se sugiriera, la contraseña que se compartió por
  // WhatsApp seguiría siendo válida meses después.
  if(perfil.debe_cambiar_password && typeof pedirCambioPassword === 'function'){
    await pedirCambioPassword();
  }

  // Si vino de un atajo del manifest, se abre ese módulo, pero
  // solo si su rol lo permite: el atajo no debe brincar permisos.
  const mod = MODULOS.flatMap(g => g.items)
    .find(m => m.id === window._moduloInicial && puedeVer(m.roles));
  irA(mod ? mod.id : 'inicio');
  window._moduloInicial = null;
}

/* Un solo listener maneja arranque, login y logout: Supabase
   dispara INITIAL_SESSION al cargar si ya habia sesion guardada,
   así que no hace falta revisar el token a mano. */
sb.auth.onAuthStateChange((evento, sesion) => {
  if(sesion?.user){
    if(!Sesion.perfil) cargarSesion(sesion.user);
  } else {
    Sesion.user = Sesion.perfil = Sesion.tenant = null;
    $('app').classList.remove('on');
    $('login').style.display = 'flex';
    $('carga').classList.add('off');
  }
});

$('lg-ver').textContent = 'v' + RHOO.VERSION;

// Red de seguridad: si Supabase no responde en 4 segundos, se
// muestra el login en lugar de dejar la pantalla de carga fija.
setTimeout(() => {
  if(!Sesion.perfil && $('carga') && !$('carga').classList.contains('off')){
    $('carga').classList.add('off');
    $('login').style.display = 'flex';
  }
}, 4000);
/* ═══════════════════════════════════════════════════════════
   PWA · registro, instalación y aviso de nueva versión
   ═══════════════════════════════════════════════════════════ */

let _instalable = null;

/* Registro del service worker. Solo en HTTPS o localhost: con
   file:// el navegador lo rechaza, y eso es normal. */
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').then(reg => {

      // Version nueva esperando. NO se recarga sola: alguien
      // capturando un expediente perderia lo escrito.
      reg.addEventListener('updatefound', () => {
        const nuevo = reg.installing;
        if(!nuevo) return;
        nuevo.addEventListener('statechange', () => {
          if(nuevo.state === 'installed' && navigator.serviceWorker.controller){
            mostrarBarraActualizar(reg);
          }
        });
      });

      // Revisa cada 30 min si hay algo nuevo desplegado
      setInterval(() => reg.update().catch(()=>{}), 30 * 60 * 1000);

    }).catch(e => console.warn('[PWA] no se registro el service worker', e));
  });
}

function mostrarBarraActualizar(reg){
  if(document.getElementById('pwa-upd')) return;
  const el = document.createElement('div');
  el.id = 'pwa-upd';
  el.className = 'pwa-barra';
  el.innerHTML =
    '<span><i class="fas fa-arrow-rotate-right"></i>'
    + 'Hay una versión nueva de RHoo!</span>'
    + '<div><button class="pwa-x" onclick="this.closest(\'.pwa-barra\').remove()">'
    + 'Después</button>'
    + '<button class="pwa-ok" id="pwa-recargar">Actualizar</button></div>';
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('on'));

  document.getElementById('pwa-recargar').onclick = () => {
    if(reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
    // controllerchange dispara cuando el sw nuevo toma el mando
    navigator.serviceWorker.addEventListener('controllerchange',
      () => location.reload());
    setTimeout(() => location.reload(), 1200);   // respaldo
  };
}

/* Instalación. El evento solo llega si el navegador considera la
   app instalable: manifest válido, service worker activo y
   HTTPS. Si no llega, el botón no se muestra en lugar de ofrecer
   algo que va a fallar. */
window.addEventListener('beforeinstallprompt', ev => {
  ev.preventDefault();
  _instalable = ev;
  pintarBotonInstalar();
});

window.addEventListener('appinstalled', () => {
  _instalable = null;
  document.getElementById('pwa-inst')?.remove();
  toast('ok', 'RHoo! quedó instalada en tu dispositivo');
});

const esIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
const yaInstalada = () =>
  window.matchMedia('(display-mode: standalone)').matches ||
  window.navigator.standalone === true;

function pintarBotonInstalar(){
  if(yaInstalada() || document.getElementById('pwa-inst')) return;
  const pie = document.querySelector('.nav-pie');
  if(!pie) return;

  const b = document.createElement('button');
  b.id = 'pwa-inst';
  b.className = 'pwa-instalar';
  b.innerHTML = '<i class="fas fa-mobile-screen"></i> Instalar app';
  b.onclick = instalarApp;
  pie.insertBefore(b, pie.firstChild);
}

async function instalarApp(){
  // iOS no implementa beforeinstallprompt: la unica via es el
  // menu Compartir, asi que se explica en lugar de fallar.
  if(!_instalable){
    modal({
      titulo: 'Instalar RHoo!',
      subtitulo: esIOS()
        ? 'En iPhone o iPad: toca el botón Compartir del navegador y elige '
          + '"Agregar a pantalla de inicio".'
        : 'Tu navegador no ofrece instalación automática. Busca "Instalar" o '
          + '"Agregar a pantalla de inicio" en su menú.',
      ok: 'Entendido', cancelar: ''
    });
    return;
  }
  _instalable.prompt();
  const r = await _instalable.userChoice;
  if(r.outcome === 'accepted') _instalable = null;
}

/* Atajos del manifest: ?ir=asistencia abre ese módulo directo.
   Se guarda y se aplica DESPUES del login, porque al arrancar
   todavía no se sabe si el usuario tiene permiso de verlo. */
const _irA = new URLSearchParams(location.search).get('ir');
if(_irA){
  window._moduloInicial = _irA;
  history.replaceState({}, '', location.pathname);
}

/* En iOS el botón nunca aparecería porque no hay evento. Se
   muestra de todos modos cuando no está instalada. */
if(esIOS() && !yaInstalada()){
  window.addEventListener('load', () => setTimeout(pintarBotonInstalar, 1500));
}
</script>
